<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europe Intelligence & News Dispatch</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Left Panel: Europe Continent & Country Thick Buttons --- */
        .continent-panel {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .continent-header {
            padding: 20px;
            font-size: 1.25rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
            background: #111827;
            letter-spacing: 0.5px;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        .country-list-container {
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        /* Custom scrollbar for clean appearance */
        .country-list-container::-webkit-scrollbar {
            width: 6px;
        }
        .country-list-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        /* Thick Continent Country Buttons */
        .country-btn {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .country-btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px -1px rgba(0, 0, 0, 0.3);
        }

        .country-btn:active {
            transform: translateY(0);
        }

        .country-btn::after {
            content: "›";
            font-size: 1.2rem;
            opacity: 0.7;
        }

        /* --- Main Content Area --- */
        .main-content {
            flex-grow: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        /* --- Hot News Panel --- */
        .news-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        /* Small header styling */
        .news-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            font-weight: 700;
        }

        /* Big Textfield Container */
        .news-textarea-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .news-textarea {
            width: 100%;
            height: 220px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            color: var(--text-main);
            font-size: 1rem;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        .news-textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .dispatch-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .dispatch-btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .dispatch-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <!-- Left Panel: Europe Continent -->
    <aside class="continent-panel">
        <div class="continent-header">🌍 Europe Continent</div>
        <div class="country-list-container">
            <button class="country-btn">Belgium</button>
            <button class="country-btn">Finland</button>
            <button class="country-btn">France</button>
            <button class="country-btn">Germany</button>
            <button class="country-btn">Ireland</button>
            <button class="country-btn">Italy</button>
            <button class="country-btn">Norway</button>
            <button class="country-btn">Poland</button>
            <button class="country-btn">Portugal</button>
            <button class="country-btn">Russia</button>
            <button class="country-btn">Spain</button>
            <button class="country-btn">Sweden</button>
            <button class="country-btn">Switzerland</button>
            <button class="country-btn">Ukraine</button>
            <button class="country-btn">United Kingdom</button>
        </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-content">
        <!-- Hot News Panel -->
        <section class="news-panel">
            <h2 class="news-title">Global Hot News Intelligence Dispatch</h2>
            <div class="news-textarea-wrapper">
                <textarea class="news-textarea" placeholder="Enter or stream real-time intelligence dispatch summaries, policy updates, and agricultural developments across European sectors..."></textarea>
            </div>
            <div class="dispatch-meta">
                <span>Status: Live feed connected</span>
                <button class="dispatch-btn">Push Dispatch</button>
            </div>
        </section>
    </main>

</body>
</html>
