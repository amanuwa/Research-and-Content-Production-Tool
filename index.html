<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research & Content Production Tool - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            margin: 0; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column;
            background-color: #02040e; position: relative; overflow-x: hidden; overflow-y: auto;
        }
        /* FUTURISTIC CYBER BACKDROP */
        .cyber-backdrop-container {
            position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(circle at center, #071235 0%, #02040e 100%);
            pointer-events: none;
        }
        .hud-overlay {
            position: absolute; inset: 0;
            background-image: 
                linear-gradient(to right, rgba(16, 185, 129, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
            background-size: 50px 50px; z-index: 1; pointer-events: none;
        }
        .scanline {
            position: absolute; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, #10b981, #00f2fe, #10b981, transparent);
            box-shadow: 0 0 20px #10b981; top: 0; z-index: 4;
            animation: scanning 3s linear infinite; pointer-events: none;
        }
        @keyframes scanning {
            0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; }
        }
        .app-interface { position: relative; z-index: 10; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <!-- Futuristic Cyber Background Elements -->
    <div class="cyber-backdrop-container">
        <div class="hud-overlay"></div>
        <div class="scanline"></div>
    </div>

    <!-- Main Content Box -->
    <div class="app-interface w-full max-w-md p-8 bg-slate-900/80 backdrop-blur-md rounded-2xl shadow-2xl border border-emerald-500/30">
        <h2 class="text-2xl font-bold mb-6 text-emerald-400 text-center tracking-wider">Sign In to Dashboard</h2>

        <form id="signin-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none text-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none text-white">
            </div>
            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-semibold rounded-lg transition duration-200 text-white shadow-lg shadow-emerald-900/40">Sign In</button>
        </form>

        <div class="mt-6 text-center">
            <a href="signup.html" class="text-sm text-emerald-400 hover:underline">Don't have an account? Create Account</a>
        </div>
    </div>

    <script type="module">
        import { supabase, DEV_MODE_OVERRIDE } from './config.js';

        document.getElementById('signin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({
                email,
                password
            });

            if (error) {
                alert('Sign-In Error: ' + error.message);
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
